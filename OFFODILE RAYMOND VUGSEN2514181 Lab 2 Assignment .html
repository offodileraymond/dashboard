<!DOCTYPE html>

<title>Student Records</title>

<style>
table {
  width: 100%;
  border-collapse: collapse;
  border-spacing: 10px;
  border-radius: 10px;
  overflow: hidden;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
}
th {
  background-color: #0b4f9c;
  color: white;
  text-align: left;
}
tr:nth-child(even) {
  background-color: #f2f2f2;
}
td:nth-child(even) {
  background-color: #e6f2ff;
}
tr:hover {
  background-color: #D6EEEE;
}
tr {
  border-bottom: 1px solid #ddd;
}
</style>

</head>
